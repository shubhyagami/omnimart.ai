<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Create Account')}"></head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- Brand -->
            <div class="text-center mb-4">
                <a th:href="@{/}" class="omni-logo justify-content-center text-dark fs-2">
                    <i class="fa-solid fa-bolt-lightning text-warning"></i> OmniMart<span class="text-primary">.ai</span>
                </a>
            </div>

            <!-- Register Card -->
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <h3 class="fw-bold mb-3 text-dark">Create Account</h3>

                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>

                <form th:action="@{/register}" th:object="${registerRequest}" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Your name</label>
                        <input type="text" th:field="*{fullName}" class="form-control" required placeholder="First and last name">
                        <div class="text-danger small" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required placeholder="you@example.com">
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" required placeholder="At least 6 characters">
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Mobile number (optional)</label>
                        <input type="text" th:field="*{phone}" class="form-control" placeholder="+91 98000 00000">
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark mb-3">
                        Create your OmniMart Account
                    </button>
                </form>

                <div class="text-center small text-muted">
                    Already have an account? <a th:href="@{/login}" class="fw-bold text-primary text-decoration-none">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
