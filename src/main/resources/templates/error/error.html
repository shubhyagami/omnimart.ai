<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('An Error Occurred')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/header :: navbar}"></header>

<main class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 bg-white mx-auto" style="max-width: 600px;">
        <i class="fa-solid fa-circle-exclamation fs-1 text-danger mb-3"></i>
        <h2 class="fw-bold mb-2">Something Went Wrong</h2>
        <p class="text-danger mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred.'}">Error message</p>
        <div>
            <a th:href="@{/}" class="btn btn-warning fw-bold px-4">Back to Safe Ground</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
