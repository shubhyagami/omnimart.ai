<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Page Not Found')}"></head>
<body class="bg-light">
<header th:replace="~{fragments/header :: navbar}"></header>

<main class="container py-5 text-center">
    <div class="card border-0 shadow-sm rounded-4 p-5 bg-white mx-auto" style="max-width: 600px;">
        <i class="fa-solid fa-triangle-exclamation fs-1 text-warning mb-3"></i>
        <h2 class="fw-bold mb-2">Page Not Found (404)</h2>
        <p class="text-muted mb-4">The page you were looking for doesn't exist or has been moved.</p>
        <div>
            <a th:href="@{/}" class="btn btn-warning fw-bold px-4">Return to Homepage</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
