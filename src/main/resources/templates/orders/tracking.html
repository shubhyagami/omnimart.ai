<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Track Package')}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<main class="container py-4">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb small">
            <li class="breadcrumb-item"><a th:href="@{/orders}">Your Orders</a></li>
            <li class="breadcrumb-item"><a th:href="@{/orders/{id}(id=${order.id})}">Order Details</a></li>
            <li class="breadcrumb-item active" aria-current="page">Tracking</li>
        </ol>
    </nav>

    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white mb-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4 pb-3 border-bottom">
            <div>
                <h3 class="fw-bold mb-1"><i class="fa-solid fa-truck-ramp-box text-primary me-2"></i>Package Tracking</h3>
                <span class="text-muted small">Tracking Number: <strong class="text-dark" th:text="${order.trackingNumber}">TRK-EXP-12345678</strong></span>
            </div>
            <div>
                <span class="badge bg-primary px-3 py-2 fs-6" th:text="${order.carrier}">OmniExpress Logistics</span>
            </div>
        </div>

        <!-- Tracking Stepper Graphic -->
        <div class="py-4">
            <div class="row text-center position-relative">
                <div class="col-3">
                    <div class="fs-2 text-success mb-2"><i class="fa-solid fa-circle-check"></i></div>
                    <h6 class="fw-bold mb-0">Ordered</h6>
                    <small class="text-muted" th:text="${#temporals.format(order.createdAt, 'dd MMM')}">15 Aug</small>
                </div>
                <div class="col-3">
                    <div class="fs-2 mb-2" th:classappend="${order.status.name() != 'PENDING' ? 'text-success' : 'text-secondary'}">
                        <i class="fa-solid" th:classappend="${order.status.name() != 'PENDING' ? 'fa-circle-check' : 'fa-circle-dot'}"></i>
                    </div>
                    <h6 class="fw-bold mb-0">Shipped</h6>
                    <small class="text-muted">Omni Fulfillment Center</small>
                </div>
                <div class="col-3">
                    <div class="fs-2 mb-2" th:classappend="${order.status.name() == 'DELIVERED' or order.status.name() == 'OUT_FOR_DELIVERY' ? 'text-success' : 'text-secondary'}">
                        <i class="fa-solid" th:classappend="${order.status.name() == 'DELIVERED' or order.status.name() == 'OUT_FOR_DELIVERY' ? 'fa-circle-check' : 'fa-circle-dot'}"></i>
                    </div>
                    <h6 class="fw-bold mb-0">Out for Delivery</h6>
                    <small class="text-muted">Local Hub</small>
                </div>
                <div class="col-3">
                    <div class="fs-2 mb-2" th:classappend="${order.status.name() == 'DELIVERED' ? 'text-success' : 'text-secondary'}">
                        <i class="fa-solid" th:classappend="${order.status.name() == 'DELIVERED' ? 'fa-circle-check' : 'fa-circle'}"></i>
                    </div>
                    <h6 class="fw-bold mb-0">Delivered</h6>
                    <small class="text-muted">Signed & Received</small>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
