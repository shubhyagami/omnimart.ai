<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Your Orders')}"></head>
<body>
<header th:replace="~{fragments/header :: navbar}"></header>

<main class="container py-4">
    <h2 class="fw-bold mb-4"><i class="fa-solid fa-box-open text-primary me-2"></i>Your Orders</h2>

    <div th:if="${#lists.isEmpty(orders)}" class="card border-0 shadow-sm rounded-4 p-5 text-center bg-white">
        <i class="fa-solid fa-bag-shopping fs-1 text-muted mb-3"></i>
        <h4>No orders found</h4>
        <p class="text-muted">You have not placed any orders yet.</p>
        <div>
            <a th:href="@{/products}" class="btn btn-warning fw-bold px-4">Start Shopping</a>
        </div>
    </div>

    <div th:unless="${#lists.isEmpty(orders)}" class="d-flex flex-column gap-4">
        <div th:each="order : ${orders}" class="card border-0 shadow-sm rounded-4 overflow-hidden bg-white">
            <!-- Order Header Bar -->
            <div class="card-header bg-light py-3 px-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
                <div class="d-flex flex-wrap gap-4 small text-muted">
                    <div>
                        <span class="d-block text-uppercase fw-bold" style="font-size: 0.72rem;">Order Placed</span>
                        <span class="text-dark fw-semibold" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}">15 Aug 2026</span>
                    </div>
                    <div>
                        <span class="d-block text-uppercase fw-bold" style="font-size: 0.72rem;">Total</span>
                        <span class="text-dark fw-semibold" th:text="'₹' + ${#numbers.formatDecimal(order.finalAmount, 0, 'COMMA', 0, 'POINT')}">₹49,999</span>
                    </div>
                    <div>
                        <span class="d-block text-uppercase fw-bold" style="font-size: 0.72rem;">Ship To</span>
                        <span class="text-dark fw-semibold" th:text="${order.shippingAddress != null ? order.shippingAddress.fullName : 'Customer'}">Rahul Sharma</span>
                    </div>
                </div>

                <div>
                    <span class="d-block small text-muted text-end" style="font-size: 0.72rem;">ORDER # <span th:text="${order.orderNumber}">ORD-1234</span></span>
                    <a th:href="@{/orders/{id}(id=${order.id})}" class="small text-primary fw-bold text-decoration-none">View Order Details</a>
                </div>
            </div>

            <!-- Order Body Items -->
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge px-3 py-2 fs-6"
                          th:classappend="${order.status.name() == 'DELIVERED' ? 'bg-success' : (order.status.name() == 'CANCELLED' ? 'bg-danger' : 'bg-primary')}"
                          th:text="${order.status}">CONFIRMED</span>
                    <a th:href="@{/orders/{id}/tracking(id=${order.id})}" class="btn btn-outline-primary btn-sm fw-bold">
                        <i class="fa-solid fa-location-arrow me-1"></i>Track Package
                    </a>
                </div>

                <div th:each="item : ${order.items}" class="row align-items-center py-2 g-3">
                    <div class="col-3 col-md-2 text-center">
                        <img th:src="${item.productImageUrl}" th:alt="${item.productName}" class="img-fluid rounded" style="max-height: 70px; object-fit: contain;"
                             onerror="this.src='https://placehold.co/80x80?text=Product'">
                    </div>
                    <div class="col-9 col-md-10">
                        <h6 class="fw-bold mb-1">
                            <a th:href="@{/products/{id}(id=${item.product.id})}" class="text-dark text-decoration-none" th:text="${item.productName}">Product Name</a>
                        </h6>
                        <small class="text-muted">Quantity: <strong th:text="${item.quantity}">1</strong> | Price: <strong th:text="'₹' + ${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}">₹49,999</strong></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/chat-widget :: chatWidget}"></div>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
